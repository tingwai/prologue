<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      width: 350px;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #f9fafb;
    }

    h2 {
      font-size: 18px;
      margin-bottom: 12px;
      color: #1f2937;
    }

    p {
      font-size: 13px;
      color: #6b7280;
      line-height: 1.5;
      margin-bottom: 16px;
    }

    .form-group {
      margin-bottom: 16px;
    }

    label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 6px;
      color: #374151;
    }

    input[type="password"] {
      width: 100%;
      padding: 8px 10px;
      border: 1px solid #d1d5db;
      border-radius: 6px;
      font-size: 13px;
      font-family: monospace;
    }

    input:focus {
      outline: none;
      border-color: #3b82f6;
      box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
    }

    .help-text {
      font-size: 11px;
      color: #9ca3af;
      margin-top: 4px;
    }

    .help-text a {
      color: #3b82f6;
      text-decoration: none;
    }

    .help-text a:hover {
      text-decoration: underline;
    }

    button {
      width: 100%;
      padding: 8px;
      background: #3b82f6;
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }

    button:hover {
      background: #2563eb;
    }

    .status {
      margin-top: 12px;
      padding: 8px;
      border-radius: 4px;
      font-size: 12px;
      text-align: center;
      display: none;
    }

    .status.success {
      background: #d1fae5;
      color: #065f46;
      display: block;
    }

    .status.error {
      background: #fee2e2;
      color: #991b1b;
      display: block;
    }

    .divider {
      height: 1px;
      background: #e5e7eb;
      margin: 16px 0;
    }

    .link-button {
      display: block;
      width: 100%;
      padding: 8px;
      text-align: center;
      background: #f3f4f6;
      color: #374151;
      text-decoration: none;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 500;
      margin-top: 8px;
    }

    .link-button:hover {
      background: #e5e7eb;
    }
  </style>
</head>
<body>
  <h2>🤖 PR Context Assistant</h2>
  <p>AI-powered code explanations for GitHub PRs using Claude</p>

  <div class="form-group">
    <label for="apiKey">Anthropic API Key</label>
    <input 
      type="password" 
      id="apiKey" 
      placeholder="sk-ant-xxxxxxxxxxxxxxxxxxxx"
    >
    <div class="help-text">
      Get your key from <a href="https://console.anthropic.com/" target="_blank">console.anthropic.com</a>
    </div>
  </div>

  <button id="save">Save API Key</button>
  
  <div id="status" class="status"></div>

  <div class="divider"></div>

  <a href="options.html" class="link-button" id="openOptions">Open Full Settings</a>

  <script src="popup.js"></script>
</body>
</html>
